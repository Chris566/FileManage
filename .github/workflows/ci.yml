name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, runtime in subfolder)
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          # 主程序 self-contained 发布
          dotnet publish src/FileManage.App/FileManage.App.csproj -c Release -r win-x64 --self-contained true `
            /p:InformationalVersion=$ver -o publish-runtime
          "InformationalVersion=$ver" | Out-Host
          # 编排：runtime\ 子目录承载全部运行时与依赖（删除 apphost/符号/崩溃转储）
          New-Item -ItemType Directory -Path publish/runtime -Force | Out-Null
          Move-Item publish-runtime/* publish/runtime/
          Remove-Item "publish/runtime/FileManage.exe","publish/runtime/*.pdb" -Force
          Remove-Item "publish/runtime/createdump.exe" -Force -ErrorAction SilentlyContinue
          # NativeAOT 启动器 → 根目录 FileManage.exe（hostfxr 从 runtime\ 加载运行时）
          dotnet publish src/FileManage.Launcher/FileManage.Launcher.csproj -c Release -r win-x64 -o publish-launcher
          Copy-Item publish-launcher/FileManage.Launcher.exe publish/FileManage.exe -Force
          # 生成版本清单（根目录相对路径，如 runtime/xxx.dll），供客户端增量安装与跨版本残留清理
          $files = Get-ChildItem publish -Recurse -File | ForEach-Object {
            @{
              path  = [IO.Path]::GetRelativePath("publish", $_.FullName).Replace('\', '/')
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              size  = $_.Length
            }
          }
          [ordered]@{
            version = $ver
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
            files = $files
          } | ConvertTo-Json -Depth 4 | Set-Content "publish/manifest.json" -Encoding UTF8
          # 压缩包结构：FileManage.zip 内仅一个名为 FileManage 的文件夹（含 exe/runtime/manifest）
          # 解压后得到 FileManage\…，名称永远固定、不含版本号
          New-Item -ItemType Directory -Path zip-stage/FileManage -Force | Out-Null
          Move-Item publish/* zip-stage/FileManage/
          Compress-Archive -Path "zip-stage/*" -DestinationPath "FileManage.zip"
          Get-Item "FileManage.zip" | Out-Host

      - name: Smoke test (launcher boots WPF app)
        shell: pwsh
        run: |
          $p = Start-Process "zip-stage/FileManage/FileManage.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "启动器提前退出（退出码 $($p.ExitCode)），可能 runtime 布局或 hostfxr 初始化失败" }
          Stop-Process -Id $p.Id -Force
          "启动冒烟测试通过（进程存活）" | Out-Host

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileManage
          path: FileManage.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history to read tag message)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: FileManage
          path: artifact

      # 提取标签附注消息作为 Release Notes（打标签时的更新内容）
      - name: Extract release notes from tag message
        run: git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "artifact/FileManage.zip" \
            --title "FileManage ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md --verify-tag \
          || gh release upload "${GITHUB_REF_NAME}" "artifact/FileManage.zip" --clobber
