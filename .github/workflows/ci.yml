name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained portable folder)
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          dotnet publish src/FileManage.App/FileManage.App.csproj -c Release -r win-x64 --self-contained true `
            /p:InformationalVersion=$ver -o publish
          "InformationalVersion=$ver" | Out-Host
          # 便携版：zip 根目录即 FileManage.exe + 依赖，数据写入解压目录下 Data\
          Compress-Archive -Path "publish/*" -DestinationPath "FileManage-$($env:GITHUB_REF_NAME).zip"
          Get-Item "FileManage-$($env:GITHUB_REF_NAME).zip" | Out-Host

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileManage-${{ github.ref_name }}
          path: FileManage-${{ github.ref_name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history to read tag message)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: FileManage-${{ github.ref_name }}
          path: artifact

      # 提取标签附注消息作为 Release Notes（打标签时的更新内容）
      - name: Extract release notes from tag message
        run: git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ZIP=$(ls artifact/FileManage-*.zip)
          gh release create "${GITHUB_REF_NAME}" "$ZIP" \
            --title "FileManage ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md --verify-tag \
          || gh release upload "${GITHUB_REF_NAME}" "$ZIP" --clobber
